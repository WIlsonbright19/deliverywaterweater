[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"
  NPM_FLAGS = "--legacy-peer-deps"

# SPA fallback so deep links and refreshes never return 404 on Netlify
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Long-term caching for Vite fingerprinted assets
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
